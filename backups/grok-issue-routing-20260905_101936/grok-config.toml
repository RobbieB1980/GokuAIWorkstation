[cli]
installer = "internal"
auto_update = true

[models]
default = "grok-4.5"
default_reasoning_effort = "high"
temperature = 0.15000000596046448
top_p = 0.8999999761581421
max_completion_tokens = 8192
max_retries = 3
inference_idle_timeout_secs = 900
stream_tool_calls = true

[model.goku-fast]
model = "goku-fast"
base_url = "http://127.0.0.1:11437/v1"
name = "Goku Fast - Qwen3-Coder-30B-A3B EXL3 4.0bpw"
context_window = 65536
temperature = 0.05
max_completion_tokens = 8192
supports_reasoning_effort = false
reasoning_effort = "none"

[model.goku-code]
model = "goku-code"
base_url = "http://127.0.0.1:11437/v1"
name = "Goku Code - Qwen3-Coder-30B-A3B EXL3 4.0bpw"
context_window = 65536
temperature = 0.1
max_completion_tokens = 12288
supports_reasoning_effort = false
reasoning_effort = "none"

[model.goku-heavy]
model = "goku-heavy"
base_url = "http://127.0.0.1:11437/v1"
name = "Goku Heavy - Mia Qwen3.8-27B EXL3 3.5bpw"
context_window = 65536
temperature = 0.1
max_completion_tokens = 12288
supports_reasoning_effort = false
reasoning_effort = "none"

[model.goku-research]
model = "goku-research"
base_url = "http://127.0.0.1:11437/v1"
name = "Goku Research - Mia Qwen3.8-27B EXL3 3.5bpw"
context_window = 65536
temperature = 0.1
top_p = 0.9
max_completion_tokens = 12288
supports_reasoning_effort = false
reasoning_effort = "none"

[subagents]
enabled = true

[subagents.toggle]
explore = true
plan = true

[subagents.models]
explore = "goku-research"
plan = "goku-heavy"
general-purpose = "goku-code"

[subagents.roles.goku-fast]
description = "Cheap mechanical tasks, classification, quick lookups, small edits."
default_capability_mode = "all"
model = "goku-fast"

[subagents.roles.goku-code]
description = "Implement one scoped coding task. Return a compact summary; store bulky logs under .gokuai/tasks/."
default_capability_mode = "all"
model = "goku-code"

[subagents.roles.goku-heavy]
description = "Hard planning/reasoning after normal code work fails, or deep multi-step analysis."
default_capability_mode = "all"
model = "goku-heavy"

[subagents.roles.goku-research]
description = "Narrow read-only investigation; return paths and short findings."
default_capability_mode = "read-only"
model = "goku-research"

[subagents.personas.goku-compact]
instructions = """
Work on exactly one scoped task.
Do not request or ingest the entire parent conversation.
Return only: task id, status, files changed, evidence/source paths, validation performed, unresolved items, confidence, next recommended task.
Store large logs and detailed notes under .gokuai/tasks/<task-id>/ in the project.
If blocked, say what failed in <=15 lines and what input would unblock you.
"""
description = "Compact local EXL3 worker result contract."
model = "goku-code"
default_isolation = "none"

[features]
telemetry = false
feedback = false
lsp_tools = true

[memory]
enabled = false

[permission]
allow = [
    "Read",
    "Grep",
]

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
fork_secondary_model = "grok-4.6"
yolo = false
compact_mode = false
permission_mode = "always-approve"
